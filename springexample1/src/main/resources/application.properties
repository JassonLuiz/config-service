spring.application.name=spring-example-1
server.port=${SERVER_PORT:8085}

config.api.username=${CONFIG_API_USERNAME:admin}
config.api.password=${CONFIG_API_PASSWORD:admin123}
config.api.base-url=${CONFIG_API_BASE_URL:http://localhost:8080}

# Configuração da aplicação
config.namespace=${CONFIG_NAMESPACE:my-app}
config.environment=${CONFIG_ENVIRONMENT:dev}

# Configuração do Kafka para a biblioteca
config.client.kafka.enabled=true
config.client.kafka.topics=config.${config.namespace}.${config.environment}
config.client.kafka.group-id=${spring.application.name}
config.client.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

config.client.sync.timeout=30s
config.client.sync.batch-size=50
config.client.sync.retry.max-attempts=3
config.client.sync.retry.backoff=1s

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=0
spring.data.redis.timeout=2000ms

# Kafka - Configuração base
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Kafka Consumer
spring.kafka.consumer.group-id=${spring.application.name}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

# Deserializadores com tratamento de erro
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

# Configuração do JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=io.github.configservice.contracts.event
spring.kafka.consumer.properties.spring.json.use.type.info.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=io.github.configservice.contracts.event.ConfigEvent

# Timeout e configurações de performance
spring.kafka.consumer.properties.session.timeout.ms=30000
spring.kafka.consumer.properties.heartbeat.interval.ms=10000
spring.kafka.consumer.properties.max.poll.interval.ms=300000
spring.kafka.consumer.properties.max.poll.records=10

# Logs
logging.level.io.github.clientlibrary.client_library=INFO
logging.level.io.github.springexample.springexample1=DEBUG
logging.level.org.springframework.kafka=WARN
logging.level.org.apache.kafka=WARN
