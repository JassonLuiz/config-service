services:
  postgres:
    image: postgres:15
    container_name: config-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-configdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-configdb}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - config-net
    volumes:
      - postgres_data:/var/lib/postgresql/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: config-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - config-net

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: config-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # HOST: acesso a partir da maquina do desenvolvedor. DOCKER: acesso entre containers.
      KAFKA_ADVERTISED_LISTENERS: HOST://${KAFKA_ADVERTISED_HOST:-localhost}:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_LISTENERS: HOST://0.0.0.0:9092,DOCKER://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:29092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 15
    networks:
      - config-net
    volumes:
      - kafka_data:/var/lib/kafka/data

  redis:
    image: redis:7
    container_name: config-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - config-net
    volumes:
      - redis_data:/data

  kafdrop:
    image: obsidiandynamics/kafdrop
    container_name: config-kafdrop
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKER_CONNECT: kafka:29092
      SERVER_PORT: 9000
    networks:
      - config-net
    restart: unless-stopped

  config-service:
    build:
      context: .
      dockerfile: config-service/Dockerfile
    container_name: config-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-configdb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-password}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CONFIG_ADMIN_USERNAME: ${CONFIG_ADMIN_USERNAME:-admin}
      CONFIG_ADMIN_PASSWORD: ${CONFIG_ADMIN_PASSWORD:-admin123}
    networks:
      - config-net
    restart: unless-stopped

  springexample1:
    build:
      context: .
      dockerfile: springexample1/Dockerfile
    container_name: config-demo-app
    depends_on:
      config-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8085:8085"
    environment:
      CONFIG_API_BASE_URL: http://config-service:8080
      CONFIG_API_USERNAME: ${CONFIG_ADMIN_USERNAME:-admin}
      CONFIG_API_PASSWORD: ${CONFIG_ADMIN_PASSWORD:-admin123}
      CONFIG_NAMESPACE: ${CONFIG_NAMESPACE:-my-app}
      CONFIG_ENVIRONMENT: ${CONFIG_ENVIRONMENT:-dev}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - config-net
    restart: unless-stopped

volumes:
  postgres_data:
  kafka_data:
  redis_data:

networks:
  config-net:
