name: CI - Develop

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:

  detect-changes:
    name: Detectar projetos alterados
    runs-on: ubuntu-latest
    outputs:
      config-service: ${{ steps.filter.outputs.config-service }}
      client-library: ${{ steps.filter.outputs.client-library }}
      # ↓ Adicione novos projetos aqui no futuro
      # novo-projeto: ${{ steps.filter.outputs.novo-projeto }}

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🔎 Verificar arquivos alterados
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            config-service:
              - 'config-service/**'
            client-library:
              - 'client-library/**'
            # ↓ Adicione novos projetos aqui no futuro
            # novo-projeto:
            #   - 'novo-projeto/**'

  build-config-service:
    name: Build & Validate (config-service)
    needs: detect-changes
    if: needs.detect-changes.outputs.config-service == 'true'
    uses: ./.github/workflows/reusable-build.yml
    with:
      project-path: config-service

  build-client-library:
    name: Build & Validate (client-library)
    needs: detect-changes
    if: needs.detect-changes.outputs.client-library == 'true'
    uses: ./.github/workflows/reusable-build.yml
    with:
      project-path: client-library

  # ↓ Adicione novos projetos aqui no futuro
  # build-novo-projeto:
  #   name: Build & Validate (novo-projeto)
  #   needs: detect-changes
  #   if: needs.detect-changes.outputs.novo-projeto == 'true'
  #   uses: ./.github/workflows/reusable-build.yml
  #   with:
  #     project-path: novo-projeto

  # ─────────────────────────────────────────────
  # Job consolidado — sempre roda e reporta o
  # status geral. É ele que o ruleset monitora.
  # ─────────────────────────────────────────────
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [build-config-service, build-client-library]
    if: always()
    steps:
      - name: ✅ Verificar resultado geral
        run: |
          if [[ "${{ needs.build-config-service.result }}" == "failure" || \
                "${{ needs.build-client-library.result }}" == "failure" ]]; then
            echo "❌ Um ou mais builds falharam!"
            exit 1
          fi
          echo "✅ Todos os builds passaram ou foram ignorados corretamente!"

  save-artifacts:
    name: Salvar artefatos
    runs-on: ubuntu-latest
    needs: [build-config-service, build-client-library]
    if: |
      always() &&
      github.event_name == 'push' &&
      (needs.build-config-service.result == 'success' || needs.build-config-service.result == 'skipped') &&
      (needs.build-client-library.result == 'success' || needs.build-client-library.result == 'skipped')

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: ☕ Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: 🏗️ Build de todos os projetos alterados para salvar artefatos
        run: |
          for dir in config-service client-library; do
            if [ -f "$dir/pom.xml" ]; then
              echo "📦 Buildando $dir..."
              cd "$GITHUB_WORKSPACE/$dir"
              mvn clean package -DskipTests --no-transfer-progress
              cd "$GITHUB_WORKSPACE"
            fi
          done

      - name: 📦 Salvar artefatos (5 dias)
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-develop-${{ github.sha }}
          path: '**/target/*.jar'
          retention-days: 5