name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
      - 'feature/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build e testes (reator completo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Checkstyle
        run: mvn -B checkstyle:check --no-transfer-progress

      - name: Build e testes
        run: mvn -B verify --no-transfer-progress

      - name: Publicar relatorio de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ github.sha }}
          path: '**/target/surefire-reports/**'
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: Validar imagens Docker
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Validar docker-compose
        run: docker compose config --quiet

      - name: Build da imagem do config-service
        run: docker build -f config-service/Dockerfile -t config-service:ci .

      - name: Build da imagem da aplicacao demonstrativa
        run: docker build -f springexample1/Dockerfile -t springexample1:ci .

  release:
    name: Publicar artefatos e criar tag
    runs-on: ubuntu-latest
    needs: [build, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build final
        run: mvn -B clean package -DskipTests --no-transfer-progress

      - name: Salvar artefatos (30 dias)
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-production-${{ github.sha }}
          path: '**/target/*.jar'
          retention-days: 30

      - name: Criar tag de versao
        run: |
          VERSION="v$(date +'%Y.%m.%d')-$(echo ${{ github.sha }} | cut -c1-7)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION"
          git push origin "$VERSION"
