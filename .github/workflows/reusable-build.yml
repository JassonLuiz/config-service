name: Build Java Project

on:
  workflow_call:
    inputs:
      project-path:
        description: 'Caminho do projeto (ex: config-service)'
        required: true
        type: string
      java-version:
        description: 'Versão do Java'
        required: false
        type: string
        default: '21'

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: ☕ Configurar Java ${{ inputs.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: 🔎 Diagnóstico de ambiente
        run: |
          echo "=== GITHUB_WORKSPACE ==="
          echo "$GITHUB_WORKSPACE"
          echo ""
          echo "=== project-path recebido ==="
          echo "${{ inputs.project-path }}"
          echo ""
          echo "=== Diretório atual ==="
          pwd
          echo ""
          echo "=== Conteúdo da raiz ==="
          ls -la $GITHUB_WORKSPACE
          echo ""
          echo "=== Caminho completo do projeto ==="
          echo "$GITHUB_WORKSPACE/${{ inputs.project-path }}"
          echo ""
          echo "=== Conteúdo do projeto ==="
          ls -la "$GITHUB_WORKSPACE/${{ inputs.project-path }}" || echo "⚠️ Pasta não encontrada!"

      - name: 🔍 Checkstyle
        run: |
          cd "$GITHUB_WORKSPACE/${{ inputs.project-path }}"
          echo "=== Rodando Checkstyle em: $(pwd) ==="
          mvn checkstyle:check --no-transfer-progress \
            -Dcheckstyle.config.location="$GITHUB_WORKSPACE/checkstyle.xml"

      - name: 🏗️ Build
        run: |
          cd "$GITHUB_WORKSPACE/${{ inputs.project-path }}"
          mvn clean package -DskipTests --no-transfer-progress

      - name: ✅ Verificar artefato gerado
        run: |
          cd "$GITHUB_WORKSPACE/${{ inputs.project-path }}"
          if [ -z "$(find target -name '*.jar' -not -name '*sources*')" ]; then
            echo "❌ Nenhum JAR encontrado em ${{ inputs.project-path }}!"
            exit 1
          fi
          echo "✅ Build de ${{ inputs.project-path }} gerado com sucesso!"