name: CI - Main (Produção)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:

  detect-changes:
    name: Detectar projetos alterados
    runs-on: ubuntu-latest
    outputs:
      config-service: ${{ steps.filter.outputs.config-service }}
      client-library: ${{ steps.filter.outputs.client-library }}
      # ↓ Adicione novos projetos aqui no futuro
      # novo-projeto: ${{ steps.filter.outputs.novo-projeto }}

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🔎 Verificar arquivos alterados
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            config-service:
              - 'config-service/**'
            client-library:
              - 'client-library/**'
            # ↓ Adicione novos projetos aqui no futuro
            # novo-projeto:
            #   - 'novo-projeto/**'

  build-config-service:
    name: Validação Final para Produção
    needs: detect-changes
    if: needs.detect-changes.outputs.config-service == 'true'
    uses: ./.github/workflows/reusable-build.yml
    with:
      project-path: config-service

  build-client-library:
    name: Validação Final para Produção
    needs: detect-changes
    if: needs.detect-changes.outputs.client-library == 'true'
    uses: ./.github/workflows/reusable-build.yml
    with:
      project-path: client-library

  # ↓ Adicione novos projetos aqui no futuro
  # build-novo-projeto:
  #   name: Validação Final para Produção
  #   needs: detect-changes
  #   if: needs.detect-changes.outputs.novo-projeto == 'true'
  #   uses: ./.github/workflows/reusable-build.yml
  #   with:
  #     project-path: novo-projeto

  release:
    name: Salvar artefatos e criar tag de versão
    runs-on: ubuntu-latest
    needs: [build-config-service, build-client-library]
    if: |
      always() &&
      github.event_name == 'push' &&
      (needs.build-config-service.result == 'success' || needs.build-config-service.result == 'skipped') &&
      (needs.build-client-library.result == 'success' || needs.build-client-library.result == 'skipped')

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: ☕ Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: 🏗️ Build final de todos os projetos
        run: |
          for dir in config-service client-library; do
            if [ -f "$dir/pom.xml" ]; then
              echo "📦 Buildando $dir..."
              cd "$GITHUB_WORKSPACE/$dir"
              mvn clean package -DskipTests --no-transfer-progress
              cd "$GITHUB_WORKSPACE"
            fi
          done

      - name: 📦 Salvar artefatos de produção (30 dias)
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-production-${{ github.sha }}
          path: '**/target/*.jar'
          retention-days: 30

      - name: 🏷️ Criar tag de versão automática
        run: |
          VERSION="v$(date +'%Y.%m.%d')-$(echo ${{ github.sha }} | cut -c1-7)"
          echo "🏷️ Versão gerada: $VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag $VERSION
          git push origin $VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}